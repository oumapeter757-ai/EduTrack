spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000

edutrack:
  fees:
    encryption-key: YWRtaW4xMjM0NTY3ODkwYWRtaW4xMjM0NTY3ODkw
  storage:
    base-path: /tmp/edutrack-test-uploads
    max-file-size: 10485760
    school-quota-bytes: 1073741824
    allowed-extensions: pdf,doc,docx,ppt,pptx,xls,xlsx,txt,png,jpg,jpeg
    min-free-bytes: 104857600
    cleanup-grace-hours: 1
    cleanup-batch-size: 100
    cleanup-interval-ms: 86400000
