spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:edutrack-mysql-dev.mysql.database.azure.com}:${DB_PORT:3306}/${DB_NAME:edutrack}?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USERNAME:edutrackadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
