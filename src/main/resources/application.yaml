spring:
  application:
    name: EduTrack
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active:
      - dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_updates: true
        connection_provider_disables_autocommit: true
  datasource:
    hikari:
      connection-init-sql: "SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED"
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  web:
    error:
      include-message: never
      include-binding-errors: never
  data:
    web:
      pageable:
        max-page-size: 100

    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2s
      repositories:
        enabled: false



  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enabled: ${SPRING_MAIL_SMTP_STARTTLS_ENABLED:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
    default-encoding: UTF-8

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

edutrack:
  notifications:
    email:
      enabled: ${EDUTRACK_NOTIFICATION_EMAIL_ENABLED:false}
      provider: ${EDUTRACK_NOTIFICATION_EMAIL_PROVIDER:fake}
      from: ${EDUTRACK_NOTIFICATION_EMAIL_FROM:}
    sms:
      enabled: ${EDUTRACK_NOTIFICATION_SMS_ENABLED:false}
      mode: ${EDUTRACK_NOTIFICATION_SMS_MODE:DISABLED}
      username: ${EDUTRACK_NOTIFICATION_SMS_USERNAME:}
      api-key: ${EDUTRACK_NOTIFICATION_SMS_API_KEY:}
      sender-id: ${EDUTRACK_NOTIFICATION_SMS_SENDER_ID:}
      base-url: ${EDUTRACK_NOTIFICATION_SMS_BASE_URL:}
      connect-timeout-millis: ${EDUTRACK_NOTIFICATION_SMS_CONNECT_TIMEOUT_MS:3000}
      request-timeout-millis: ${EDUTRACK_NOTIFICATION_SMS_REQUEST_TIMEOUT_MS:10000}
      maximum-message-characters: ${EDUTRACK_NOTIFICATION_SMS_MAX_MESSAGE_CHARACTERS:1600}
    sms-quota:
      monthly-segments:
        FREE: ${EDUTRACK_NOTIFICATION_SMS_QUOTA_FREE:0}
        BASIC: ${EDUTRACK_NOTIFICATION_SMS_QUOTA_BASIC:0}
        STANDARD: ${EDUTRACK_NOTIFICATION_SMS_QUOTA_STANDARD:0}
        PREMIUM: ${EDUTRACK_NOTIFICATION_SMS_QUOTA_PREMIUM:0}
        ENTERPRISE: ${EDUTRACK_NOTIFICATION_SMS_QUOTA_ENTERPRISE:0}
    destination-encryption-key: ${EDUTRACK_NOTIFICATION_DESTINATION_ENCRYPTION_KEY:}
    opt-out-signing-key: ${EDUTRACK_NOTIFICATION_OPT_OUT_SIGNING_KEY:}
    public-base-url: ${EDUTRACK_NOTIFICATION_PUBLIC_BASE_URL:}
    teacher-announcements-enabled: ${EDUTRACK_NOTIFICATION_TEACHER_ANNOUNCEMENTS_ENABLED:false}
    worker:
      batch-size: ${EDUTRACK_NOTIFICATION_WORKER_BATCH_SIZE:50}
      lease-seconds: ${EDUTRACK_NOTIFICATION_WORKER_LEASE_SECONDS:120}
      maximum-attempts: ${EDUTRACK_NOTIFICATION_WORKER_MAXIMUM_ATTEMPTS:5}
      retry-base-seconds: ${EDUTRACK_NOTIFICATION_WORKER_RETRY_BASE_SECONDS:30}
      retry-maximum-seconds: ${EDUTRACK_NOTIFICATION_WORKER_RETRY_MAXIMUM_SECONDS:3600}
      poll-delay-ms: ${EDUTRACK_NOTIFICATION_WORKER_POLL_DELAY_MS:5000}
    retention:
      message-days: ${EDUTRACK_NOTIFICATION_RETENTION_MESSAGE_DAYS:365}
      audit-days: ${EDUTRACK_NOTIFICATION_RETENTION_AUDIT_DAYS:730}
      batch-size: ${EDUTRACK_NOTIFICATION_RETENTION_BATCH_SIZE:1000}
  cache:
    enabled: ${EDUTRACK_CACHE_ENABLED:false}
    schemaVersion: 1
  fees:
    encryption-key: ${EDUTRACK_FEES_ENCRYPTION_KEY:}
  auth:
    rate-limit:
      login-email-max-failures: ${EDUTRACK_AUTH_RATE_LIMIT_LOGIN_EMAIL_MAX_FAILURES:5}
      login-ip-max-failures: ${EDUTRACK_AUTH_RATE_LIMIT_LOGIN_IP_MAX_FAILURES:30}
      signup-ip-max-attempts: ${EDUTRACK_AUTH_RATE_LIMIT_SIGNUP_IP_MAX_ATTEMPTS:5}
      window-seconds: ${EDUTRACK_AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
      signup-window-seconds: ${EDUTRACK_AUTH_RATE_LIMIT_SIGNUP_WINDOW_SECONDS:3600}
      public-lookup-max-attempts: ${EDUTRACK_AUTH_RATE_LIMIT_PUBLIC_LOOKUP_MAX_ATTEMPTS:30}
      trusted-proxy: ${EDUTRACK_AUTH_RATE_LIMIT_TRUSTED_PROXY:false}
  storage:
    base-path: ${EDUTRACK_STORAGE_PATH:}
    provider: ${EDUTRACK_STORAGE_PROVIDER:local}
    azure:
      endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:}
      container: ${EDUTRACK_STORAGE_BLOB_CONTAINER:edutrack-files}
      sas-token: ${AZURE_STORAGE_BLOB_SAS_TOKEN:}
    max-file-size: ${EDUTRACK_STORAGE_MAX_FILE_SIZE:10485760}
    school-quota-bytes: ${EDUTRACK_STORAGE_SCHOOL_QUOTA_BYTES:1073741824}
    allowed-extensions: ${EDUTRACK_STORAGE_ALLOWED_EXTENSIONS:pdf,doc,docx,ppt,pptx,xls,xlsx,txt,png,jpg,jpeg}
    min-free-bytes: ${EDUTRACK_STORAGE_MIN_FREE_BYTES:104857600}
    cleanup-grace-hours: ${EDUTRACK_STORAGE_CLEANUP_GRACE_HOURS:24}
    cleanup-batch-size: ${EDUTRACK_STORAGE_CLEANUP_BATCH_SIZE:100}
    cleanup-interval-ms: ${EDUTRACK_STORAGE_CLEANUP_INTERVAL_MS:86400000}

application:
  security:
    jwt:
      # RSA private key (PKCS8 PEM) for RS256 signing.
      # Generate with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
      secret-key: ${JWT_SECRET_KEY}
      # RSA public key (PEM) for RS256 verification — optional; if omitted,
      # the public key is derived from the private key (single-instance mode).
      # For multi-instance deployments, provide the public key explicitly.
      public-key: ${JWT_PUBLIC_KEY:}
      expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

mpesa:
  till-number: ${MPESA_TILL_NUMBER:}
  short-code: ${MPESA_SHORT_CODE:}
  consumer-key: ${MPESA_CONSUMER_KEY:}
  consumer-secret: ${MPESA_CONSUMER_SECRET:}
  passkey: ${MPESA_PASSKEY:}
  environment: ${MPESA_ENVIRONMENT:sandbox}
  callback-url: ${MPESA_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  # Use a random 32-byte token and include it as ?token=... on callback URLs.
  webhook-token: ${MPESA_PAYMENT_WEBHOOK_TOKEN:}

# Set edutrack.bootstrap.token from an environment variable for the first
# administrator only, then remove the variable after signup succeeds.